<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Now Playing</title>
<style>
  :root{
    --bg: #14181a;
    --panel: #1c2225;
    --brass: #c9a24b;
    --brass-dim: #8a713a;
    --text: #ece7dc;
    --text-dim: #8a9296;
    --needle-red: #b5493f;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%;
    background: radial-gradient(ellipse at 50% -10%, #232a2d 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    overflow:hidden;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 4vh 4vw;
  }

  /* ---- login screen ---- */
  #login{
    text-align:center;
    max-width:420px;
  }
  #login h1{
    font-size:1.4rem;
    font-weight:600;
    letter-spacing:0.02em;
    margin-bottom:0.6rem;
  }
  #login p{
    color:var(--text-dim);
    font-size:0.95rem;
    line-height:1.5;
    margin-bottom:1.8rem;
  }
  #login button{
    background: linear-gradient(180deg, #d4b566, var(--brass-dim));
    color:#1a1a1a;
    border:none;
    padding: 0.9rem 2.2rem;
    border-radius: 999px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    box-shadow: 0 4px 14px rgba(201,162,75,0.3);
  }
  #login button:active{ transform: translateY(1px); }

  /* ---- dock face ---- */
  #dock{
    display:none;
    width:min(90vw, 640px);
    background: linear-gradient(180deg, #23292c, var(--panel));
    border-radius: 28px;
    padding: 2.6rem 2.8rem;
    box-shadow:
      0 30px 60px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.04);
    border: 1px solid #2c3336;
  }
  #dock.show{ display:block; }

  .face{
    display:flex;
    gap: 2rem;
    align-items:center;
  }
  #art-wrap{
    position:relative;
    flex-shrink:0;
    width: 168px;
    height: 168px;
    border-radius: 12px;
    overflow:hidden;
    background:#000;
    box-shadow: 0 10px 26px rgba(0,0,0,0.5);
  }
  #art{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  #led{
    position:absolute;
    top:10px; right:10px;
    width:9px; height:9px;
    border-radius:50%;
    background: var(--needle-red);
    box-shadow: 0 0 8px 2px rgba(181,73,63,0.7);
  }
  #led.paused{ background:#5a6265; box-shadow:none; }

  .info{ min-width:0; flex:1; }
  #track{
    font-size:1.5rem;
    font-weight:700;
    line-height:1.25;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #artist{
    margin-top:0.35rem;
    font-size:1.02rem;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  #meter{
    margin-top:1.4rem;
    height:3px;
    width:100%;
    background:#33393c;
    border-radius:3px;
    overflow:hidden;
  }
  #meter-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--brass-dim), var(--brass));
    transition: width 0.4s linear;
  }
  #times{
    margin-top:0.5rem;
    display:flex;
    justify-content:space-between;
    font-size:0.78rem;
    color:var(--text-dim);
    letter-spacing:0.02em;
  }

  #idle-msg{
    display:none;
    text-align:center;
    color:var(--text-dim);
    font-size:1rem;
    padding: 1rem 0;
  }
  #idle-msg.show{ display:block; }
  #dock.idle .face{ display:none; }

  #status{
    position:fixed;
    bottom:16px;
    left:0; right:0;
    text-align:center;
    font-size:0.72rem;
    color:#5a6265;
    letter-spacing:0.03em;
  }
</style>
</head>
<body>

  <div id="login">
    <h1>Now Playing Dock</h1>
    <p>Log in with Spotify once. After that, this page just watches whatever's playing on your account — no need to open Spotify itself.</p>
    <button id="login-btn">Connect Spotify</button>
  </div>

  <div id="dock">
    <div class="face">
      <div id="art-wrap">
        <img id="art" src="" alt="">
        <div id="led"></div>
      </div>
      <div class="info">
        <div id="track">—</div>
        <div id="artist">—</div>
        <div id="meter"><div id="meter-fill"></div></div>
        <div id="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
      </div>
    </div>
    <div id="idle-msg">Nothing's playing right now.</div>
  </div>

  <div id="status"></div>

<script>
/* ======================================================================
   SETUP: paste your Spotify Client ID below.
   Get one free at https://developer.spotify.com/dashboard
   Add THIS EXACT PAGE'S URL as a Redirect URI in that app's settings.
   ====================================================================== */
const CLIENT_ID = "3a29f0ca7d9944698053718cfa71edb3";
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = "user-read-currently-playing user-read-playback-state";

/* ---------------- PKCE helpers ---------------- */
function randomString(len){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let out = "";
  const rand = crypto.getRandomValues(new Uint8Array(len));
  for(let i=0;i<len;i++) out += chars[rand[i] % chars.length];
  return out;
}
async function sha256(plain){
  const data = new TextEncoder().encode(plain);
  return await crypto.subtle.digest('SHA-256', data);
}
function base64UrlEncode(buffer){
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

let accessToken = null;
let refreshToken = null;
let tokenExpiresAt = 0;

/* ---------------- Auth flow ---------------- */
document.getElementById('login-btn').addEventListener('click', async () => {
  const verifier = randomString(64);
  sessionStorage.setItem('pkce_verifier', verifier);
  const challenge = base64UrlEncode(await sha256(verifier));

  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge
  });
  window.location = `https://accounts.spotify.com/authorize?${params.toString()}`;
});

async function exchangeCodeForToken(code){
  const verifier = sessionStorage.getItem('pkce_verifier');
  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: 'authorization_code',
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: {'Content-Type':'application/x-www-form-urlencoded'},
    body
  });
  if(!res.ok) throw new Error('Token exchange failed');
  const data = await res.json();
  setTokens(data);
  sessionStorage.setItem('refresh_token', data.refresh_token);
  window.history.replaceState({}, document.title, REDIRECT_URI);
}

async function refreshAccessToken(){
  const rt = refreshToken || sessionStorage.getItem('refresh_token');
  if(!rt) return false;
  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: 'refresh_token',
    refresh_token: rt
  });
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: {'Content-Type':'application/x-www-form-urlencoded'},
    body
  });
  if(!res.ok) return false;
  const data = await res.json();
  if(!data.refresh_token) data.refresh_token = rt;
  setTokens(data);
  sessionStorage.setItem('refresh_token', data.refresh_token);
  return true;
}

function setTokens(data){
  accessToken = data.access_token;
  refreshToken = data.refresh_token;
  tokenExpiresAt = Date.now() + (data.expires_in * 1000) - 30000;
}

function showDock(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('dock').classList.add('show');
}

/* ---------------- Now-playing polling ---------------- */
function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60);
  const sec = String(s % 60).padStart(2,'0');
  return `${m}:${sec}`;
}

let lastTrackId = null;

async function pollNowPlaying(){
  if(Date.now() >= tokenExpiresAt){
    const ok = await refreshAccessToken();
    if(!ok){ document.getElementById('status').textContent = 'Session expired — reload to log in again.'; return; }
  }
  try{
    const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });

    if(res.status === 204){
      document.getElementById('dock').classList.add('idle');
      document.getElementById('idle-msg').classList.add('show');
      return;
    }
    if(!res.ok){ return; }

    const data = await res.json();
    if(!data || !data.item) return;

    document.getElementById('dock').classList.remove('idle');
    document.getElementById('idle-msg').classList.remove('show');

    const item = data.item;
    const artUrl = item.album.images[0]?.url || '';
    if(item.id !== lastTrackId){
      document.getElementById('art').src = artUrl;
      document.getElementById('track').textContent = item.name;
      document.getElementById('artist').textContent = item.artists.map(a=>a.name).join(', ');
      document.getElementById('t-dur').textContent = fmtTime(item.duration_ms);
      lastTrackId = item.id;
    }

    const pct = Math.min(100, (data.progress_ms / item.duration_ms) * 100);
    document.getElementById('meter-fill').style.width = pct + '%';
    document.getElementById('t-cur').textContent = fmtTime(data.progress_ms);

    const led = document.getElementById('led');
    led.classList.toggle('paused', !data.is_playing);

  }catch(e){ /* silent — retry on next poll */ }
}

/* ---------------- Boot ---------------- */
(async function init(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  if(code){
    await exchangeCodeForToken(code);
    showDock();
    pollNowPlaying();
    setInterval(pollNowPlaying, 2000);
    return;
  }

  const storedRefresh = sessionStorage.getItem('refresh_token');
  if(storedRefresh){
    refreshToken = storedRefresh;
    const ok = await refreshAccessToken();
    if(ok){
      showDock();
      pollNowPlaying();
      setInterval(pollNowPlaying, 2000);
    }
  }
})();
</script>
</body>
</html>
